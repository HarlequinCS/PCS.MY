<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Projek Cuti Sem - Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 25%, #c44569 50%, #a55eea 75%, #8854d0 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Animated floating shapes */
    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.3;
      animation: floatShape 20s infinite ease-in-out;
    }

    .shape.circle {
      border-radius: 50%;
    }

    .shape.triangle {
      border-radius: 0;
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 35px solid rgba(255, 255, 255, 0.3);
      background: none;
    }

    .shape.square {
      border-radius: 10px;
    }

    @keyframes floatShape {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 0.3;
      }
      25% {
        transform: translate(100px, -100px) rotate(90deg) scale(1.2);
        opacity: 0.5;
      }
      50% {
        transform: translate(-50px, -200px) rotate(180deg) scale(0.8);
        opacity: 0.3;
      }
      75% {
        transform: translate(-150px, -100px) rotate(270deg) scale(1.1);
        opacity: 0.5;
      }
    }

    /* Animated particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: particleFloat 15s infinite ease-in-out;
    }

    @keyframes particleFloat {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100px);
        opacity: 0;
      }
    }

    .container {
      text-align: center;
      max-width: 1000px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .logo-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 60px 50px;
      box-shadow: 
        0 25px 80px rgba(0, 0, 0, 0.3),
        0 0 0 2px rgba(255, 255, 255, 0.2),
        inset 0 0 60px rgba(255, 255, 255, 0.1);
      position: relative;
      animation: containerFadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                  box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .logo-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .logo-container:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 
        0 30px 100px rgba(0, 0, 0, 0.4),
        0 0 0 3px rgba(255, 255, 255, 0.3),
        inset 0 0 80px rgba(255, 255, 255, 0.15);
    }

    @keyframes containerFadeIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ff0000 0%, #cc0000 50%, #ff0000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: textGradient 3s ease infinite;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.3s forwards, textGradient 3s ease infinite;
      position: relative;
      z-index: 2;
    }

    @keyframes textGradient {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      max-width: 400px;
      width: 60%;
      height: auto;
      display: block;
      margin: 0 auto 50px;
      filter: drop-shadow(0 10px 25px rgba(255, 0, 0, 0.2));
      animation: logoFadeIn 1.2s ease-out 0.2s both, logoFloat 4s ease-in-out infinite;
      transition: filter 0.3s ease, transform 0.3s ease;
      position: relative;
      z-index: 2;
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .logo:hover {
      filter: drop-shadow(0 15px 35px rgba(255, 0, 0, 0.35));
      transform: translateY(-5px) scale(1.05);
    }

    @keyframes logoFadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .coming-soon {
      font-size: 3.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff0000 0%, #cc0000 50%, #ff0000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: fadeInUp 1s ease-out 0.5s forwards, textGradient 3s ease infinite;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 50px;
      font-weight: 400;
      letter-spacing: 1.5px;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.7s forwards;
      position: relative;
      z-index: 2;
    }

    /* Professional Loading Animation */
    .loader-container {
      margin-top: 50px;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.9s forwards;
      position: relative;
      z-index: 2;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .loader {
      position: relative;
      width: 120px;
      height: 5px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff0000 0%, #cc0000 50%, #ff0000 100%);
      background-size: 200% 100%;
      border-radius: 3px;
      animation: loadingProgress 2s ease-in-out infinite,
                 gradientShift 3s ease-in-out infinite;
    }

    @keyframes loadingProgress {
      0% {
        width: 0%;
        left: 0%;
      }
      50% {
        width: 70%;
        left: 0%;
      }
      100% {
        width: 0%;
        left: 100%;
      }
    }

    .loader-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .loader-dot {
      width: 8px;
      height: 8px;
      background: #ff0000;
      border-radius: 50%;
      opacity: 0.5;
      animation: dotPulse 1.4s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    .loader-dot:nth-child(1) {
      animation-delay: 0s;
    }

    .loader-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotPulse {
      0%, 100% {
        opacity: 0.5;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    .status-text {
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 2px;
      font-weight: 400;
      margin-top: 10px;
      text-transform: uppercase;
    }

    /* Decorative animated elements */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      animation: sparkle 2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 768px) {
      .logo-container {
        padding: 50px 35px;
        border-radius: 25px;
      }

      .coming-soon {
        font-size: 2.5rem;
        letter-spacing: 2px;
      }

      .subtitle {
        font-size: 1rem;
      }

      .brand-name {
        font-size: 1.1rem;
        letter-spacing: 3px;
      }

      .logo {
        max-width: 300px;
        width: 70%;
      }
    }

    @media (max-width: 480px) {
      .coming-soon {
        font-size: 2rem;
        letter-spacing: 1.5px;
      }

      .logo-container {
        padding: 40px 25px;
        border-radius: 20px;
      }

      .brand-name {
        font-size: 0.95rem;
        margin-bottom: 30px;
      }

      .logo {
        max-width: 250px;
        width: 75%;
        margin-bottom: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="floating-shapes" id="floatingShapes"></div>
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <div class="logo-container">
      <div class="brand-name">Projek Cuti Sem</div>
      
      <img src="images/PCS logo.svg" alt="Projek Cuti Sem Logo" class="logo">
      
      <h1 class="coming-soon">Coming Soon</h1>
      
      <p class="subtitle">We're crafting something extraordinary. Stay tuned for updates.</p>
      
      <div class="loader-container">
        <div class="loader-wrapper">
          <div class="loader">
            <div class="loader-bar"></div>
          </div>
          <div class="loader-dots">
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
          </div>
          <div class="status-text">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Create floating shapes
    function createFloatingShapes() {
      const container = document.getElementById('floatingShapes');
      const shapes = ['circle', 'square', 'triangle'];
      const colors = ['rgba(255, 255, 255, 0.3)', 'rgba(255, 0, 0, 0.2)', 'rgba(255, 255, 255, 0.25)'];
      
      for (let i = 0; i < 15; i++) {
        const shape = document.createElement('div');
        shape.className = `shape ${shapes[Math.floor(Math.random() * shapes.length)]}`;
        
        const size = Math.random() * 60 + 30;
        shape.style.width = size + 'px';
        shape.style.height = size + 'px';
        shape.style.background = colors[Math.floor(Math.random() * colors.length)];
        shape.style.left = Math.random() * 100 + '%';
        shape.style.top = Math.random() * 100 + '%';
        shape.style.animationDelay = Math.random() * 20 + 's';
        shape.style.animationDuration = (Math.random() * 10 + 15) + 's';
        
        container.appendChild(shape);
      }
    }

    // Create particles
    function createParticles() {
      const container = document.getElementById('particles');
      
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (Math.random() * 5 + 10) + 's';
        
        container.appendChild(particle);
      }
    }

    // Create sparkles
    function createSparkles() {
      const container = document.querySelector('.logo-container');
      
      setInterval(() => {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = Math.random() * 100 + '%';
        sparkle.style.top = Math.random() * 100 + '%';
        sparkle.style.animationDelay = Math.random() * 2 + 's';
        
        container.appendChild(sparkle);
        
        setTimeout(() => {
          sparkle.remove();
        }, 2000);
      }, 500);
    }

    // Subtle mouse parallax effect
    let mouseX = 0;
    let mouseY = 0;
    let currentX = 0;
    let currentY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 15;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 15;
    });

    function animateParallax() {
      currentX += (mouseX - currentX) * 0.05;
      currentY += (mouseY - currentY) * 0.05;
      
      const logo = document.querySelector('.logo');
      if (logo) {
        logo.style.transform = `translate(${currentX}px, ${currentY}px)`;
      }
      
      requestAnimationFrame(animateParallax);
    }

    // Initialize everything
    window.addEventListener('load', () => {
      createFloatingShapes();
      createParticles();
      createSparkles();
      animateParallax();
    });

    // Update status text periodically
    const statusTexts = [
      'Loading...',
      'Preparing...',
      'Almost ready...',
      'Loading...'
    ];
    
    let statusIndex = 0;
    const statusElement = document.querySelector('.status-text');
    
    setInterval(() => {
      if (statusElement) {
        statusElement.style.opacity = '0';
        setTimeout(() => {
          statusIndex = (statusIndex + 1) % statusTexts.length;
          statusElement.textContent = statusTexts[statusIndex];
          statusElement.style.opacity = '1';
        }, 300);
      }
    }, 3000);
  </script>
</body>
</html>
