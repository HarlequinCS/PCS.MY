  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 25%, #c44569 50%, #a55eea 75%, #8854d0 100%);
      background-size: 400% 400%;
      background-attachment: fixed;
      animation: gradientShift 15s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Animated floating shapes */
    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.3;
      animation: floatShape 20s infinite ease-in-out;
    }

    .shape.circle {
      border-radius: 50%;
    }

    .shape.triangle {
      border-radius: 0;
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 35px solid rgba(255, 255, 255, 0.3);
      background: none;
    }

    .shape.square {
      border-radius: 10px;
    }

    @keyframes floatShape {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 0.3;
      }
      25% {
        transform: translate(100px, -100px) rotate(90deg) scale(1.2);
        opacity: 0.5;
      }
      50% {
        transform: translate(-50px, -200px) rotate(180deg) scale(0.8);
        opacity: 0.3;
      }
      75% {
        transform: translate(-150px, -100px) rotate(270deg) scale(1.1);
        opacity: 0.5;
      }
    }

    /* Animated particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: particleFloat 15s infinite ease-in-out;
    }

    @keyframes particleFloat {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100px);
        opacity: 0;
      }
    }

    .container {
      text-align: center;
      max-width: 1000px;
      width: 100%;
      position: relative;
      z-index: 2;
      margin: 0 auto;
    }

    .logo-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 60px 50px;
      box-shadow: 
        0 25px 80px rgba(0, 0, 0, 0.3),
        0 0 0 2px rgba(255, 255, 255, 0.2),
        inset 0 0 60px rgba(255, 255, 255, 0.1);
      position: relative;
      animation: containerFadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                  box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      width: 100%;
      box-sizing: border-box;
    }

    .logo-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .logo-container:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 
        0 30px 100px rgba(0, 0, 0, 0.4),
        0 0 0 3px rgba(255, 255, 255, 0.3),
        inset 0 0 80px rgba(255, 255, 255, 0.15);
    }

    /* Disable hover effects on touch devices */
    @media (hover: none) {
      .logo-container:hover {
        transform: none;
      }

      .logo:hover {
        transform: none;
        filter: drop-shadow(0 10px 25px rgba(255, 0, 0, 0.2));
      }

      .comment-submit-btn:hover {
        transform: none;
      }

      .comment-item:hover {
        transform: translateY(-5px) scale(1.01);
      }

      .comment-item:active {
        transform: translateY(-2px) scale(1.005);
      }
    }

    @keyframes containerFadeIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ff0000 0%, #cc0000 50%, #ff0000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      background-size: 200% 200%;

    }

    @keyframes textGradient {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      max-width: 400px;
      width: 60%;
      height: auto;
      display: block;
      margin: 0 auto 50px;
      filter: drop-shadow(0 10px 25px rgba(255, 0, 0, 0.2));

      transition: filter 0.3s ease, transform 0.3s ease;
      position: relative;
      z-index: 2;
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .logo:hover {
      filter: drop-shadow(0 15px 35px rgba(255, 0, 0, 0.35));

    }

    .loader-container {
      margin-top: 50px;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.9s forwards;
      position: relative;
      z-index: 2;
    }

      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }

      overflow: hidden;

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff0000 0%, #cc0000 50%, #ff0000 100%);
      background-size: 200% 100%;
      border-radius: 3px;
      animation: loadingProgress 2s ease-in-out infinite,
                 gradientShift 3s ease-in-out infinite;
    }

    @keyframes loadingProgress {
      0% {
        width: 0%;
        left: 0%;
      }
      50% {
        width: 70%;
        left: 0%;
      }
      100% {
        width: 0%;
        left: 100%;
      }

    .loader-dots {
      display: flex;
      gap: 10px;
      justify-content: center;

    .loader-dot {
      width: 8px;
      height: 8px;
      background: #ff0000;
      border-radius: 50%;
      opacity: 0.5;
      animation: dotPulse 1.4s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    .loader-dot:nth-child(1) {
      animation-delay: 0s;
    }

    .loader-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-dot:nth-child(3) {
      animation-delay: 0.4s;

    @keyframes dotPulse {
      0%, 100% {

        </div>

          </div>
        </div>

      <!-- Visitor Counter -->

        <span class="visitor-count" id="visitorCount">0</span>
      </div>

      <!-- Comments Section -->
      <div class="comments-section">
        <h2 class="comments-title">Leave Your Encouragement</h2>
        
        <form class="comment-form" id="commentForm">
          <div class="comment-input-wrapper">
            <textarea 
              class="comment-input" 
              id="commentInput" 
              placeholder="Share your thoughts, encouragement, or feedback..."
              required
              maxlength="1000"
            ></textarea>
        </div>
          <button type="submit" class="comment-submit-btn" id="submitBtn">
            Submit Comment
          </button>
          <div class="comment-message" id="commentMessage"></div>
            </form>

        <div class="comments-list-wrapper">

          </div>
        </div>

  <script>
    // Create floating shapes
    function createFloatingShapes() {
      const container = document.getElementById('floatingShapes');
      const shapes = ['circle', 'square', 'triangle'];
      const colors = ['rgba(255, 255, 255, 0.3)', 'rgba(255, 0, 0, 0.2)', 'rgba(255, 255, 255, 0.25)'];
      
      for (let i = 0; i < 15; i++) {
        const shape = document.createElement('div');
        shape.className = `shape ${shapes[Math.floor(Math.random() * shapes.length)]}`;
        
        const size = Math.random() * 60 + 30;
        shape.style.width = size + 'px';
        shape.style.height = size + 'px';
        shape.style.background = colors[Math.floor(Math.random() * colors.length)];
        shape.style.left = Math.random() * 100 + '%';
        shape.style.top = Math.random() * 100 + '%';
        shape.style.animationDelay = Math.random() * 20 + 's';
        shape.style.animationDuration = (Math.random() * 10 + 15) + 's';
        
        container.appendChild(shape);
      }
    }

    // Create particles
    function createParticles() {
      const container = document.getElementById('particles');
      
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (Math.random() * 5 + 10) + 's';
        
        container.appendChild(particle);
      }
    }

    // Create sparkles
    function createSparkles() {
      const container = document.querySelector('.logo-container');
      
      setInterval(() => {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = Math.random() * 100 + '%';
        sparkle.style.top = Math.random() * 100 + '%';
        sparkle.style.animationDelay = Math.random() * 2 + 's';
        
        container.appendChild(sparkle);
        
        setTimeout(() => {
          sparkle.remove();
        }, 2000);
      }, 500);
    }

    // Subtle mouse parallax effect
    let mouseX = 0;
    let mouseY = 0;
    let currentX = 0;
    let currentY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 15;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 15;
    });

    function animateParallax() {
      currentX += (mouseX - currentX) * 0.05;
      currentY += (mouseY - currentY) * 0.05;
      
      const logo = document.querySelector('.logo');
      if (logo) {
        logo.style.transform = `translate(${currentX}px, ${currentY}px)`;
      }
      
      requestAnimationFrame(animateParallax);
    }

    // Visitor Counter
    async function trackVisitor() {
      try {
        const response = await fetch('api/visitor.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });
        const data = await response.json();
        if (data.success) {
          updateVisitorCount(data.total_visitors);
        }
      } catch (error) {
        console.error('Visitor tracking error:', error);
        // Try to get count anyway
        getVisitorCount();
      }
    }

    async function getVisitorCount() {
      try {
        const response = await fetch('api/visitor.php');
        const data = await response.json();
        if (data.success) {
          updateVisitorCount(data.total_visitors);
        }
      } catch (error) {
        console.error('Error getting visitor count:', error);
      }
    }

    function updateVisitorCount(count) {
      const counter = document.getElementById('visitorCount');
      if (counter) {
        // Animate count up
        const currentCount = parseInt(counter.textContent) || 0;
        const targetCount = count;
        const increment = targetCount > currentCount ? 1 : -1;
        const duration = 1000;
        const steps = Math.abs(targetCount - currentCount);
        const stepDuration = duration / steps;

        let current = currentCount;
        const timer = setInterval(() => {
          current += increment;
          counter.textContent = current;
          
          if (current === targetCount) {
            clearInterval(timer);
          }
        }, stepDuration);
      }
    }

    // Comments
    async function loadComments() {
      try {
        const response = await fetch('api/comments.php');
        const data = await response.json();
        
        if (data.success) {
          displayComments(data.comments);
        }
      } catch (error) {
        console.error('Error loading comments:', error);
        document.getElementById('commentsList').innerHTML = 
          '<div class="no-comments">Unable to load comments. Please try again later.</div>';
      }
    }

    function displayComments(comments) {
      const container = document.getElementById('commentsList');
      
      if (!comments || comments.length === 0) {
        container.innerHTML = '<div class="no-comments">No comments yet. Be the first to share your thoughts!</div>';
        return;
      }

      container.innerHTML = comments.map((comment, index) => {
        const date = new Date(comment.created_at);
        const formattedDate = date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
        
        // Get first letter for avatar
        const firstLetter = comment.comment.charAt(0).toUpperCase();
        const avatarColors = ['#ff0000', '#cc0000', '#990000', '#ff3333', '#ff6666'];
        const avatarColor = avatarColors[index % avatarColors.length];
        const commentId = comment.comment_id || index;
        
        return `
          <div class="comment-item" data-comment-id="${commentId}" style="animation-delay: ${index * 0.1}s">
            <div class="comment-header">
              <div class="comment-avatar" style="background: linear-gradient(135deg, ${avatarColor} 0%, ${avatarColor}dd 100%);">
                ${firstLetter}
                </div>
                </div>
            <div class="comment-text">${escapeHtml(comment.comment)}</div>
            <div class="comment-footer">
              <div class="comment-date">${formattedDate}</div>
              <div class="comment-like" onclick="handleLike(this, ${commentId})">
                Like
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Add 3D tilt effect to comment cards
      add3DTiltEffect();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Handle comment submission
    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const input = document.getElementById('commentInput');
      const submitBtn = document.getElementById('submitBtn');
      const messageDiv = document.getElementById('commentMessage');
      const comment = input.value.trim();

      if (!comment) {
        showMessage('Please enter a comment', 'error');
        return;
      }

      // Disable form
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      messageDiv.className = 'comment-message';
      messageDiv.style.display = 'none';

      try {
        const response = await fetch('api/comments.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ comment: comment })
        });

        const data = await response.json();

        if (data.success) {
          showMessage(data.message || 'Thank you for your comment!', 'success');
          input.value = '';
          // Reload comments
          setTimeout(() => {
            loadComments();
          }, 500);
        } else {
          // Handle rate limiting (429) with better message
          if (response.status === 429) {
            const retryAfter = data.retry_after || 60;
            showMessage(data.error || `Please wait ${retryAfter} seconds before posting again.`, 'error');
          } else {
            showMessage(data.error || 'Failed to submit comment. Please try again.', 'error');
          }
        }
      } catch (error) {
        console.error('Comment submission error:', error);
        showMessage('Network error. Please check your connection and try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Comment';
      }
    });

    function showMessage(message, type) {
      const messageDiv = document.getElementById('commentMessage');
      messageDiv.textContent = message;
      messageDiv.className = `comment-message ${type}`;
      messageDiv.style.display = 'block';

      // Auto-hide after 5 seconds
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 5000);
    }

    // 3D Tilt Effect for Comment Cards
    function add3DTiltEffect() {
      const commentItems = document.querySelectorAll('.comment-item');
      
      commentItems.forEach(item => {
        item.addEventListener('mousemove', (e) => {
          const rect = item.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = (y - centerY) / 10;
          const rotateY = (centerX - x) / 10;
          
          item.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px) scale(1.02)`;
        });
        
        item.addEventListener('mouseleave', () => {
          item.style.transform = '';
        });
      });
    }

    // Handle like button
    function handleLike(button, commentId) {
      button.style.transform = 'scale(1.3)';
      button.style.transition = 'transform 0.2s ease';
      
      setTimeout(() => {
        button.style.transform = 'scale(1)';
      }, 200);
      
      // Add visual feedback
      const originalText = button.textContent;
      button.textContent = '❤️ Liked!';
      button.style.background = 'rgba(255, 0, 0, 0.15)';
      
      setTimeout(() => {
        button.textContent = originalText;
        button.style.background = '';
      }, 1000);
    }

    // Initialize everything
    window.addEventListener('load', () => {
      createFloatingShapes();
      createParticles();
      createSparkles();
      animateParallax();
      trackVisitor();
      loadComments();
      
      // Refresh comments every 30 seconds
      setInterval(loadComments, 30000);
    });

    // Update status text periodically
    const statusTexts = [
      'Loading...',
      'Preparing...',
      'Almost ready...',
      'Loading...'
    ];
    
    let statusIndex = 0;
    const statusElement = document.querySelector('.status-text');
    
    setInterval(() => {
      if (statusElement) {
        statusElement.style.opacity = '0';
        setTimeout(() => {
          statusIndex = (statusIndex + 1) % statusTexts.length;
          statusElement.textContent = statusTexts[statusIndex];
          statusElement.style.opacity = '1';
        }, 300);
      }
    }, 3000);
  </script>
</body>
</html>
